name: Daily Job Finder Agent

# Schedule disabled per user request - run manually or via Web UI
# on:
#   schedule:
#     - cron: '0 4 * * *'
#     - cron: '30 13 * * *'
on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  find-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Finder Script
        # Email dispatch disabled - dashboard updates silently
        run: |
          python job_finder.py

      - name: Commit Updated Job Digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add JOBS_DIGEST.md
          git diff-index --quiet HEAD || git commit -m "chore: update daily job digest [skip ci]"
          git push

      - name: Create GitHub Issue Notification
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🎯 Daily Job Digest"
          content-filepath: ./JOBS_DIGEST.md
          labels: job-digest, automated
